# ==============================================================================
# MANDELA — Enterprise / standalone install (docker-compose)
#
# The whole school OS on one box: Postgres + API + Web + Caddy TLS.
# The school's own domain fronts the SAME app — full branding comes from the
# school database (name, colors, logo, PWA manifest), set in Settings.
#
#   1. cp .env.example .env        # set SCHOOL_HOST, POSTGRES_PASSWORD, secrets
#   2. docker compose up -d
#   3. docker compose exec api node dist/scripts/provision-school.js \
#        '{"name":"St Marys Junior School","slug":"stmarys","tier":"dedicated",
#          "admin":{"name":"J. Doe","email":"jd@stmarys.ac.ke","phone":"2547XXXXXXXX"}}'
#   4. Point the school's DNS (portal.stmarys.ac.ke) at this box. Done.
#
# SaaS mode reuses the same image set: one VPS runs this stack; every school
# gets a row in the control plane and its own database — no per-school config.
# ==============================================================================

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mandela_control
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandela -d mandela_control"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mandela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_CONTROL_DB: mandela_control
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?set WEB_SESSION_SECRET in .env}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in .env}
      WEB_DEFAULT_TENANT: ${SCHOOL_SLUG:-demo}
      WEB_ORIGIN: https://${SCHOOL_HOST:?set SCHOOL_HOST in .env}
      PG_POOL_MAX_SCHOOL: ${PG_POOL_MAX_SCHOOL:-5}
      PG_POOL_MAX_CONTROL: ${PG_POOL_MAX_CONTROL:-10}
    expose:
      - "4000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      MANDELA_API_URL: http://api:4000
      WEB_ORIGIN: https://${SCHOOL_HOST}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    environment:
      SCHOOL_HOST: ${SCHOOL_HOST:?set SCHOOL_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
